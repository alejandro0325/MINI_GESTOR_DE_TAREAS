<div class="container">

  <h2>Lista de Tareas</h2>

  <div class="task-form">
    <input
      type="text"
      placeholder="Nueva tarea..."
      [(ngModel)]="newTaskTitle"
    />

    <button *ngIf="editingId; else addBtn" (click)="saveEdit()">
      Guardar
    </button>

    <ng-template #addBtn>
      <button (click)="addTask()">Agregar</button>
    </ng-template>
  </div>

  <ul>
    <li *ngFor="let t of tasks">
      <span>{{ t.title }}</span>

      <button (click)="startEdit(t)">Editar</button>
      <button (click)="deleteTask(t.id!)">Eliminar</button>
    </li>
  </ul>

</div>
